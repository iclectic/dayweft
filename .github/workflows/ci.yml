name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Check for committed secrets
        run: |
          ! grep -RInE "(SUPABASE_SERVICE_ROLE|LOVABLE_API_KEY|BEGIN PRIVATE KEY|API_SECRET)" . \
            --exclude-dir=.git \
            --exclude=ci.yml

      - name: Verify locked dependencies, generation, analysis and tests
        run: bash scripts/verify.sh

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: domain-application-coverage
          path: |
            apps/dayweft_mobile/coverage/lcov.info
            packages/adaptive_day_engine/coverage/lcov.info
            packages/dayweft_domain/coverage/lcov.info
          if-no-files-found: error

      - name: Build Android debug
        run: flutter build apk --debug --no-pub
        working-directory: apps/dayweft_mobile

      - name: Build iOS simulator without signing
        run: flutter build ios --simulator --debug --no-codesign --no-pub
        working-directory: apps/dayweft_mobile
